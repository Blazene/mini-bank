services:
  - type: web
    name: mini-bank-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh scripts/start-render.sh
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: DB_POOL_MAX
        value: '5'
      - key: DB_CONNECTION_TIMEOUT_MS
        value: '10000'

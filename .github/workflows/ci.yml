name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bank:bankpass@localhost:5432/minibank_test
      JWT_SECRET: ci-test-only-secret-not-a-production-secret-123
      BCRYPT_ROUNDS: '4'
      RATE_LIMIT_ENABLED: 'false'
      TRUST_PROXY: '0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: minibank_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bank -d minibank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Migrate test database and run tests with coverage gate
        run: npm test
      - name: Audit dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - name: Upload coverage report, including on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node22
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

  docker:
    name: Docker stack verification
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Docker Engine and Compose availability
        run: |
          docker version
          docker compose version
      - name: Build and verify an isolated full stack
        run: npm run test:docker
